name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  official-skill-validation:
    name: Official Agent Skills validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Agent Skills reference validator
        run: >-
          python -m pip install
          'git+https://github.com/agentskills/agentskills.git@83021e2be457a9b6679148719c1f6074f0ad975e#subdirectory=skills-ref'
      - name: Validate every skill with skills-ref
        run: |
          for skill in .agents/skills/*; do
            skills-ref validate "$skill"
          done

  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate Agent Skills
        run: python scripts/validate_skill_pack.py
      - name: Run utility tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic demonstration
        run: python examples/synthetic_loop/run.py
      - name: Check Python syntax
        run: python -m compileall -q scripts examples tests

  safetensors-integration:
    name: Safetensors editor integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-safetensors.txt
      - name: Install editor dependencies
        run: python -m pip install -r requirements-safetensors.txt
      - name: Exercise Safetensors edit and receipt
        run: python -m unittest discover -s tests -p 'test_safetensors_editor_integration.py' -v
